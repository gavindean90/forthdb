name: ForthDB Benchmarks & io_uring

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run VM Profiling, Ramped Workloads, and io_uring Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: /tmp/forthdb-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Volatile Stack VM Benchmark (30M-55M ops/sec)
        run: cargo run --manifest-path rust/Cargo.toml --release --bin stack_vm_phases

      - name: Structural Candidate Scaling Benchmark
        run: cargo run --manifest-path rust/Cargo.toml --release --bin structural_isolated

      - name: Memory Committed World Engine Benchmark
        run: cargo run --manifest-path rust/Cargo.toml --release --bin world

      - name: Queued Ingress Controller Benchmark
        run: cargo run --manifest-path rust/Cargo.toml --release --bin queued_ingress

      - name: Ramped Library Workload & Durable io_uring Benchmarks
        run: cargo test --manifest-path rust/Cargo.toml --test queued_durable_benchmarks -- --ignored --nocapture
