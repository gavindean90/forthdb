name: Milestone 6D Lifecycle Safety

on:
  push:
  pull_request:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: read

jobs:
  lifecycle:
    name: Falsify lifecycle and writer ownership
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/forthdb-m6d-cargo-target
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run process crash and writer-lock tests
        run: |
          cargo test --manifest-path rust/Cargo.toml \
            -p forthdb-world \
            --features fault-injection \
            --test lifecycle_process \
            -- --nocapture

      - name: Run complete Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Observe lifecycle phase timing
        env:
          FORTHDB_M6D_RETAINED_DEFINITIONS: "100000"
          FORTHDB_M6D_INTENTS: "2048"
        run: |
          mkdir -p "$RUNNER_TEMP/forthdb-m6d-artifacts"
          FORTHDB_M6D_TIMING_REPORT="$RUNNER_TEMP/forthdb-m6d-artifacts/rust-lifecycle-timing.json" \
            cargo run --quiet --release --manifest-path rust/Cargo.toml \
              -p forthdb-bench --bin lifecycle_timing

      - name: Publish lifecycle summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "forthdb-m6d-artifacts" / "rust-lifecycle-timing.json"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("# Milestone 6D Lifecycle Safety\n\n")
              handle.write("The process harness verifies exclusive writer ownership, OS lock release after SIGKILL, truthful crash-prefix recovery, and writable restart.\n\n")
              if report.exists():
                  data = json.loads(report.read_text())
                  handle.write("| Metric | Observation |\n| --- | ---: |\n")
                  handle.write(f"| Intents | {data['intents']:,} |\n")
                  handle.write(f"| Epochs | {data['epochs']:,} |\n")
                  handle.write(f"| Average batch | {data['average_batch']:.2f} |\n")
                  handle.write(f"| Throughput | {data['intents_per_second']:.0f}/s |\n")
                  handle.write(f"| Derive per epoch | {data['derive_nanos_per_epoch'] / 1000:.2f} µs |\n")
                  handle.write(f"| Persist per epoch | {data['persist_nanos_per_epoch'] / 1000:.2f} µs |\n")
                  handle.write(f"| Core overlap ceiling | {data['core_stage_speedup_ceiling']:.3f}× |\n")
                  handle.write(f"| Full-pipeline ceiling | {data['full_pipeline_speedup_ceiling']:.3f}× |\n")
              else:
                  handle.write("\nNo lifecycle timing report was produced.\n")
          PY

      - name: Upload Milestone 6D evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forthdb-milestone-6d-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forthdb-m6d-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Verify repository remains clean
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "Milestone 6D execution modified the checkout." >&2
            exit 1
          fi
