name: Speculative io_uring Durability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  io-uring-epochs:
    name: Compare speculative overlap with ordinary durability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/forthdb-m6c-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run complete Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Run repeated overlap benchmark
        run: |
          mkdir -p "$RUNNER_TEMP/forthdb-m6c-artifacts"
          FORTHDB_IO_URING_EPOCH_REPORT="$RUNNER_TEMP/forthdb-m6c-artifacts/rust-io-uring-epoch-benchmarks.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin queued_io_uring_epoch

      - name: Publish transport summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "forthdb-m6c-artifacts" / "rust-io-uring-epoch-benchmarks.json"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("# Speculative io_uring Durability\n\n")
              if not report.exists():
                  handle.write("No io_uring epoch report was produced.\n")
                  raise SystemExit(0)
              data = json.loads(report.read_text())
              if data["status"] == "unavailable":
                  handle.write(f"io_uring unavailable: {data['availability_error']}\n")
                  raise SystemExit(0)
              handle.write(
                  f"Complete durable controller over {data['retained_definitions']:,} retained definitions, "
                  f"{data['producers']} producers, {data['rounds']} alternating rounds.\n\n"
              )
              handle.write(
                  "| Variant | Max batch | Median batch | Intents/s | Syncs | Writes | Submits | CQEs | Max writes in flight | Arena copy | Iovecs |\n"
              )
              handle.write(
                  "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n"
              )
              for item in data["configurations"]:
                  handle.write(
                      f"| {item['variant']} | {item['max_batch']} | {item['median_batch']:.2f} | "
                      f"{item['median_intents_per_second']:.0f} | {item['median_data_syncs']} | "
                      f"{item['median_data_writes']} | {item['median_submission_calls']} | "
                      f"{item['median_completion_events']} | {item['maximum_in_flight_writes']} | "
                      f"{item['median_arena_bytes_copied']} | {item['median_iovecs_submitted']} |\n"
                  )
              handle.write(
                  "\nBoth variants use the same queued-intent planner, bounded ingress, ticket routing, "
                  "canonical records, verified repair, publication ordering, and recovery parser.\n"
              )
          PY

      - name: Upload speculative io_uring evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forthdb-milestone-6c-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forthdb-m6c-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Verify repository remains clean
        if: always()
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "Milestone 6C execution modified the checkout." >&2
            exit 1
          fi
