name: Apply Milestone 6C Core

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact local source bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Apply and commit source bundle
        run: |
          test -f .m6c/core.tar.gz
          tar -xzf .m6c/core.tar.gz
          rm -rf .m6c
          rm .github/workflows/export-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement io_uring epoch transport core"
          git push origin "HEAD:${{ github.head_ref }}"
