name: Full Python versus Rust Ramped Library

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    name: Run identical 10k-work circulation traces
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /tmp/forthdb-python-ramped-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust ramped application
        run: |
          cargo build --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-library \
            --bin ramped

      - name: Run Rust reference trace
        run: |
          mkdir -p "$RUNNER_TEMP/forthdb-python-ramped-artifacts"
          FORTHDB_RAMPED_REPORT="$RUNNER_TEMP/forthdb-python-ramped-artifacts/rust.json" \
          "$CARGO_TARGET_DIR/release/ramped" \
            "$RUNNER_TEMP/forthdb-python-ramped-artifacts/rust-db" \
            > /dev/null

      - name: Run full Python comparison
        timeout-minutes: 50
        run: |
          python python_ramped_comparison.py \
            --rust-report "$RUNNER_TEMP/forthdb-python-ramped-artifacts/rust.json" \
            --output "$RUNNER_TEMP/forthdb-python-ramped-artifacts/comparison.json"

      - name: Publish comparison summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          artifact = Path(os.environ["RUNNER_TEMP"]) / "forthdb-python-ramped-artifacts" / "comparison.json"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("# Full ramped Python versus Rust\n\n")
              if not artifact.exists():
                  handle.write("The full Python trace did not complete.\n")
                  raise SystemExit(0)
              report = json.loads(artifact.read_text())
              handle.write(
                  "| Profile | Python | Rust VM | Rust/Python | Python commits | Rust syncs |\n"
                  "| --- | ---: | ---: | ---: | ---: | ---: |\n"
              )
              for name in ("interactive", "branch_rush"):
                  item = report["comparison"][name]
                  handle.write(
                      f"| {name} | {item['python']['intents_per_second']:.2f}/s | "
                      f"{item['rust']['intents_per_second']:.2f}/s | "
                      f"{item['rust_to_python_throughput_ratio']:.1f}x | "
                      f"{item['python']['durable_commits']} | "
                      f"{item['rust']['durable_epochs']} |\n"
                  )
              handle.write(f"\n{report['caveat']}\n")
          PY

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forthdb-python-ramped-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forthdb-python-ramped-artifacts
          if-no-files-found: warn
          retention-days: 30
