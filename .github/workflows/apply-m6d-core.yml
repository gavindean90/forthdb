name: Apply Milestone 6D Core

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Reconstruct, verify, and test lifecycle implementation
        run: |
          cat \
            .m6d/part-00 \
            .m6d/part-01 \
            .m6d/part-02 \
            .m6d/part-03-04 \
            .m6d/part-05-06 \
            .m6d/part-07-08 \
            > "$RUNNER_TEMP/m6d-core-bundle.b64"
          echo "a6445d2a76a35313ca597f5e21ec11417c1b1c12a8ba3dc0a21e369e29e1a4d8  $RUNNER_TEMP/m6d-core-bundle.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/m6d-core-bundle.b64" > "$RUNNER_TEMP/m6d-core-bundle.tar.gz"
          echo "82f2a60897e04a768f5e37e094a8ab6873dfd8c14fe88a514fd1098925b82c6c  $RUNNER_TEMP/m6d-core-bundle.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/m6d-core-bundle.tar.gz"
          rm -rf .m6d
          rm .github/workflows/export-m6d-source.yml
          rm .github/workflows/apply-m6d-core.yml
          cd rust
          cargo fmt --all
          cargo test -p forthdb-world
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement controller lifecycle and writer safety"
          git push origin "HEAD:${{ github.head_ref }}"
