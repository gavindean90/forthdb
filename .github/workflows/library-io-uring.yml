name: Library App on Admission Epoch Worlds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-io-uring:
    name: Run library workflow and recover it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/forthdb-library-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Run library on io_uring admission journal
        run: |
          mkdir -p "$RUNNER_TEMP/forthdb-library-artifacts"
          FORTHDB_LIBRARY_REPORT="$RUNNER_TEMP/forthdb-library-artifacts/library-report.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-library \
            -- "$RUNNER_TEMP/forthdb-library-artifacts/library.fdb"

      - name: Run library with the previous world materializer
        run: |
          FORTHDB_LIBRARY_MATERIALIZER=world \
          FORTHDB_LIBRARY_REPORT="$RUNNER_TEMP/forthdb-library-artifacts/library-world-report.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-library \
            -- "$RUNNER_TEMP/forthdb-library-artifacts/library-world.fdb"

      - name: Compare Python and Rust library engines
        run: |
          python library_comparison.py \
            --rust-binary "$CARGO_TARGET_DIR/release/forthdb-library" \
            --rounds 15 \
            --output "$RUNNER_TEMP/forthdb-library-artifacts/library-comparison.json"

      - name: Run ramped library circulation comparison
        run: |
          FORTHDB_RAMPED_REPORT="$RUNNER_TEMP/forthdb-library-artifacts/ramped-library.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-library \
            --bin ramped \
            -- "$RUNNER_TEMP/forthdb-library-artifacts/ramped"

      - name: Run ramped circulation with the previous world materializer
        run: |
          FORTHDB_LIBRARY_MATERIALIZER=world \
          FORTHDB_RAMPED_REPORT="$RUNNER_TEMP/forthdb-library-artifacts/ramped-library-world.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-library \
            --bin ramped \
            -- "$RUNNER_TEMP/forthdb-library-artifacts/ramped-world"

      - name: Measure bounded admission versus publication
        run: |
          FORTHDB_ADMISSION_WINDOW_REPORT="$RUNNER_TEMP/forthdb-library-artifacts/admission-window.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin admission_window \
            -- "$RUNNER_TEMP/forthdb-library-artifacts/admission-window"

      - name: Measure stack VM materialization phases
        run: |
          FORTHDB_STACK_VM_REPORT="$RUNNER_TEMP/forthdb-library-artifacts/stack-vm-phases.json" \
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin stack_vm_phases

      - name: Publish application summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "forthdb-library-artifacts" / "library-report.json"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("# Library App on Admission Epoch Worlds\n\n")
              if not report.exists():
                  handle.write("No application report was produced.\n")
                  raise SystemExit(0)
              data = json.loads(report.read_text())
              control = data["controller"]
              recovery = data["recovery"]
              handle.write(f"World: `{data['world_id']}` at version `{data['world_version']}`.\n\n")
              handle.write(
                  f"The application durably admitted `{control['submitted_intents']}` intents in "
                  f"`{control['durable_epochs']}` epochs and published "
                  f"`{control['published_worlds']}` immutable epoch worlds. Maximum semantic lag was "
                  f"`{control['maximum_semantic_lag']}` epoch(s).\n\n"
              )
              handle.write(
                  f"Recovery parity: world `{recovery['same_world']}`, version "
                  f"`{recovery['same_version']}`, frames `{recovery['same_frame_count']}`.\n"
              )
              handle.write(
                  f"VM materialized epochs: `{control['vm_materialized_epochs']}`; "
                  f"world-materializer fallbacks: `{control['world_materialized_epochs']}`.\n"
              )
              handle.write(
                  f"Final query projection deferred: "
                  f"`{data['final_query_projection_was_deferred']}`; projection cost: "
                  f"`{data['final_query_projection_elapsed_us'] / 1000:.2f} ms`. "
                  f"Recovery open: `{recovery['open_elapsed_us'] / 1000:.2f} ms`; "
                  f"recovery query projection: "
                  f"`{recovery['query_projection_elapsed_us'] / 1000:.2f} ms`.\n"
              )
              world_report = report.parent / "library-world-report.json"
              if world_report.exists():
                  baseline = json.loads(world_report.read_text())
                  handle.write(
                      f"\nComplete library scenario: token VM "
                      f"`{data['elapsed_us'] / 1000:.2f} ms`; previous materializer "
                      f"`{baseline['elapsed_us'] / 1000:.2f} ms`; identical world: "
                      f"`{data['world_id'] == baseline['world_id']}`.\n"
                  )
              comparison = report.parent / "library-comparison.json"
              if comparison.exists():
                  compared = json.loads(comparison.read_text())
                  handle.write("\n## Python versus Rust\n\n")
                  handle.write(
                      f"Median complete scenario: Python `{compared['python']['median_us'] / 1000:.2f} ms`, "
                      f"Rust io_uring `{compared['rust']['median_us'] / 1000:.2f} ms`, "
                      f"ratio `{compared['python_to_rust_median_ratio']:.2f}x`.\n\n"
                  )
                  handle.write(f"{compared['caveat']}\n")
              ramped = report.parent / "ramped-library.json"
              if ramped.exists():
                  scaled = json.loads(ramped.read_text())
                  interactive = scaled["interactive"]
                  rush = scaled["branch_rush"]
                  scale = scaled["scale"]
                  handle.write("\n## Ramped circulation\n\n")
                  handle.write(
                      f"`{scale['works']:,}` works, `{scale['copies']:,}` copies, "
                      f"`{scale['patrons']:,}` patrons, and "
                      f"`{scale['circulation_cycles'] * scale['intents_per_cycle']:,}` "
                      "ordered circulation intents.\n\n"
                  )
                  handle.write(
                      f"Interactive: `{interactive['intents_per_second']:.1f}` intents/s, "
                      f"`{interactive['syncs_per_intent']:.3f}` syncs/intent. "
                      f"Branch rush: `{rush['intents_per_second']:.1f}` intents/s, "
                      f"`{rush['syncs_per_intent']:.3f}` syncs/intent.\n\n"
                  )
                  handle.write(
                      f"Branch-rush throughput ratio: "
                      f"`{scaled['branch_rush_throughput_ratio']:.2f}x`; sync reduction: "
                      f"`{scaled['branch_rush_sync_reduction_percent']:.1f}%`; exact semantic "
                      f"projection: `{scaled['semantic_projection_equal']}`.\n"
                  )
                  handle.write(
                      f"\nDeferred compatibility projection: interactive "
                      f"`{interactive['query_projection_was_deferred']}` / "
                      f"`{interactive['query_projection_elapsed_us'] / 1000:.2f} ms`; "
                      f"branch rush `{rush['query_projection_was_deferred']}` / "
                      f"`{rush['query_projection_elapsed_us'] / 1000:.2f} ms`.\n"
                  )
                  handle.write(
                      f"Recovery open/projection: interactive "
                      f"`{interactive['recovery']['open_elapsed_us'] / 1000:.2f}` / "
                      f"`{interactive['recovery']['query_projection_elapsed_us'] / 1000:.2f} ms`; "
                      f"branch rush `{rush['recovery']['open_elapsed_us'] / 1000:.2f}` / "
                      f"`{rush['recovery']['query_projection_elapsed_us'] / 1000:.2f} ms`.\n"
                  )
                  ramped_world = report.parent / "ramped-library-world.json"
                  if ramped_world.exists():
                      baseline = json.loads(ramped_world.read_text())
                      handle.write(
                          f"\nToken VM versus previous materializer: interactive "
                          f"`{interactive['intents_per_second'] / baseline['interactive']['intents_per_second']:.2f}x`; "
                          f"branch rush "
                          f"`{rush['intents_per_second'] / baseline['branch_rush']['intents_per_second']:.2f}x`.\n"
                      )
              windowed = report.parent / "admission-window.json"
              if windowed.exists():
                  measured = json.loads(windowed.read_text())
                  handle.write("\n## Admission versus publication\n\n")
                  handle.write(
                      "| Case | Window | Intents/epoch | Journal ceiling | "
                      "Steady admission | Publication | Max lag | Catch-up |\n"
                  )
                  handle.write(
                      "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n"
                  )
                  cases = measured["cases"]
                  for case in cases:
                      ceiling = case["journal_ceiling"]
                      steady = case["steady_state"]
                      handle.write(
                          f"| {case['label']} | {case['max_unapplied_epochs']} | "
                          f"{case['intents_per_epoch']} | "
                          f"{ceiling['intents_per_second']:.1f}/s | "
                          f"{steady['admission_intents_per_second']:.1f}/s | "
                          f"{steady['publication_intents_per_second']:.1f}/s | "
                          f"{steady['maximum_durable_to_applied_lag']} | "
                          f"{steady['catch_up_elapsed_us'] / 1000:.2f} ms |\n"
                      )
                  if cases:
                      fastest_admission = max(
                          cases,
                          key=lambda case: case["journal_ceiling"]["intents_per_second"],
                      )
                      fastest_publication = max(
                          cases,
                          key=lambda case: case["steady_state"]["publication_intents_per_second"],
                      )
                      admission_rate = fastest_admission["journal_ceiling"]["intents_per_second"]
                      publication_rate = fastest_publication["steady_state"]["publication_intents_per_second"]
                      handle.write(
                          f"\nFastest raw durable admission: `{admission_rate:.1f}` intents/s "
                          f"(`{fastest_admission['label']}`), "
                          f"100k crossed: `{admission_rate >= 100_000}`.\n\n"
                      )
                      handle.write(
                          f"Fastest semantic publication: `{publication_rate:.1f}` intents/s "
                          f"(`{fastest_publication['label']}`).\n"
                      )
                  else:
                      handle.write(
                          f"\nAdmission benchmark unavailable: "
                          f"`{measured.get('availability_error', 'unknown error')}`.\n"
                      )
              stack_vm = report.parent / "stack-vm-phases.json"
              if stack_vm.exists():
                  measured = json.loads(stack_vm.read_text())
                  handle.write("\n## Stack VM materialization phases\n\n")
                  handle.write(
                      "| Width | Current | Phase 1 | Phase 2 indexed | P2/P1 | P2 allocations | Parity |\n"
                  )
                  handle.write("| ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n")
                  for case in measured["cases"]:
                      handle.write(
                          f"| {case['epoch_width']} | "
                          f"{case['current_engine']['intents_per_second']:.1f}/s | "
                          f"{case['stack_vm_phase1']['intents_per_second']:.1f}/s | "
                          f"{case['stack_vm_phase2']['intents_per_second']:.1f}/s | "
                          f"{case['phase2_retained_percent']:.1f}% | "
                          f"{case['stack_vm_phase2']['hot_path_allocations']} | "
                          f"{case['projection_parity']} |\n"
                      )
                  handle.write(
                      f"\nWidth 256 / width 16: "
                      f"`{measured['phase2_width_256_vs_16_percent']:.1f}%`; "
                      f"flat gate: `{measured['phase2_flat_gate_passed']}`; "
                      f"zero-allocation gate: `{measured['zero_allocation_gate_passed']}`; "
                      f"differential gate: `{measured['differential_gate_passed']}`.\n"
                  )
                  handle.write(f"\nPhase 2 scope: {measured['phase2_scope']}\n")
                  phase3 = measured["phase3"]
                  handle.write("\n## Stack VM Phase 3 reads\n\n")
                  handle.write(
                      "| Read | Result count | ns/query | QPS |\n"
                      "| --- | ---: | ---: | ---: |\n"
                  )
                  for label, key in [
                      ("Exact SPO", "point_lookup"),
                      ("Predicate range", "predicate_range"),
                  ]:
                      metric = phase3[key]
                      handle.write(
                          f"| {label} | {metric['result_count']} | "
                          f"{metric['ns_per_query']:.1f} | "
                          f"{metric['queries_per_second']:.1f}/s |\n"
                      )
                  concurrent = phase3["concurrent_reads"]
                  handle.write(
                      f"\nConcurrent mixed reads: "
                      f"`{concurrent['queries_per_second']:.1f}/s` across "
                      f"`{concurrent['readers']}` readers while publishing "
                      f"`{concurrent['snapshot_publications']}` snapshots; "
                      f"complete-snapshot results valid: "
                      f"`{phase3['snapshot_results_valid']}`.\n"
                  )
                  handle.write(
                      f"\nCompact base facts: `{phase3['compact_base_facts']}`; "
                      f"tail index deltas: `{phase3['tail_index_deltas']}`.\n"
                  )
                  handle.write(f"\nPhase 3 scope: {measured['phase3_scope']}\n")
          PY

      - name: Upload application database and report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forthdb-library-io-uring-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forthdb-library-artifacts
          if-no-files-found: warn
          retention-days: 30
