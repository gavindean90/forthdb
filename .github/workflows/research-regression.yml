name: Research Regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-regression:
    name: Reproduce ForthDB research evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep generated interpreter and compiler state outside the checkout so
      # the final cleanliness assertion measures real repository mutations.
      PYTHONPYCACHEPREFIX: /tmp/forthdb-python-cache
      CARGO_TARGET_DIR: /tmp/forthdb-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up reference Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Python source compiles
        run: |
          python -m py_compile \
            forthdb_kernel.py \
            library_demo.py \
            deployment_demo.py \
            forthdb_atomic.py \
            atomic_demo.py \
            forthdb_world.py \
            world_library_demo.py \
            world_deployment_demo.py \
            conformance_runner.py \
            research_regression.py

      - name: Test Rust semantic and committed-world engines
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Run conformance, benchmarks, and research regression
        env:
          FORTHDB_REPORT_DIR: ${{ runner.temp }}/forthdb-research-artifacts
        run: |
          mkdir -p "$FORTHDB_REPORT_DIR"
          python conformance_runner.py \
            --output "$FORTHDB_REPORT_DIR/python-conformance-v1.json"
          cargo run --quiet \
            --manifest-path rust/Cargo.toml \
            -p forthdb-conformance \
            -- conformance/v1/kernel_cases.json \
            > "$FORTHDB_REPORT_DIR/rust-conformance-v1.json"
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin forthdb-bench \
            > "$FORTHDB_REPORT_DIR/rust-kernel-benchmarks.json"
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin world \
            > "$FORTHDB_REPORT_DIR/rust-world-benchmarks.json"
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin file \
            > "$FORTHDB_REPORT_DIR/rust-file-benchmarks.json"
          cargo run --quiet --release \
            --manifest-path rust/Cargo.toml \
            -p forthdb-bench \
            --bin mmap \
            > "$FORTHDB_REPORT_DIR/rust-mmap-benchmarks.json"
          python research_regression.py --output-dir "$FORTHDB_REPORT_DIR"

      - name: Publish regression summary
        if: always()
        env:
          FORTHDB_REPORT_DIR: ${{ runner.temp }}/forthdb-research-artifacts
        run: |
          report="$FORTHDB_REPORT_DIR/regression-report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# ForthDB Research Regression" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No regression report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path(os.environ["FORTHDB_REPORT_DIR"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          reports = [
              (
                  "rust-kernel-benchmarks.json",
                  "Rust semantic-kernel benchmark observation",
              ),
              (
                  "rust-world-benchmarks.json",
                  "Rust MemoryCommitStore benchmark observation",
              ),
              (
                  "rust-file-benchmarks.json",
                  "Rust FileCommitStore benchmark observation",
              ),
              (
                  "rust-mmap-benchmarks.json",
                  "Rust MmapCommitStore benchmark observation",
              ),
          ]

          with summary.open("a", encoding="utf-8") as handle:
              for filename, title in reports:
                  path = report_dir / filename
                  if not path.exists():
                      continue
                  data = json.loads(path.read_text())
                  handle.write(f"\n## {title}\n\n")
                  handle.write(
                      "Hosted-runner timings are observations, not merge thresholds or cross-system claims.\n\n"
                  )
                  handle.write(
                      "| Workload | Median ns/op | Median ops/s | Operations/sample |\n"
                  )
                  handle.write("| --- | ---: | ---: | ---: |\n")
                  for measurement in data["measurements"]:
                      handle.write(
                          f"| `{measurement['name']}` | "
                          f"{measurement['median_ns_per_operation']:.2f} | "
                          f"{measurement['median_operations_per_second']:.0f} | "
                          f"{measurement['operations_per_sample']} |\n"
                      )
                  handle.write(
                      f"\nRelease profile on `{data['environment']['os']}/"
                      f"{data['environment']['architecture']}`; total harness time "
                      f"`{data['total_elapsed_ms']} ms`.\n"
                  )
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forthdb-research-regression-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forthdb-research-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Verify repository remains clean
        if: always()
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "Regression execution modified the checkout." >&2
            exit 1
          fi
