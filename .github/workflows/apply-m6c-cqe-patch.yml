name: Apply Milestone 6C CQE Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    name: Apply audited CQE patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Apply, commit, and remove transfer files
        run: |
          git apply --check .m6c/cqe.patch
          git apply .m6c/cqe.patch
          rm -rf .m6c
          rm .github/workflows/apply-m6c-cqe-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden io_uring CQE validation"
          git push origin "HEAD:${{ github.head_ref }}"
