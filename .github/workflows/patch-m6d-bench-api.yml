name: Patch Milestone 6D Benchmark API

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Add explicit stopped and poisoned benchmark failures
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("rust/crates/forthdb-bench/src/bin/queued_file_epoch.rs"),
              Path("rust/crates/forthdb-bench/src/bin/queued_io_uring_epoch.rs"),
          ]

          def insert_after_block(lines, marker, new_lines):
              index = next((i for i, line in enumerate(lines) if marker in line), None)
              if index is None:
                  raise SystemExit(f"marker {marker!r} missing")
              close = index + 1
              while close < len(lines) and lines[close].strip() != "}":
                  close += 1
              if close >= len(lines):
                  raise SystemExit(f"closing brace missing after {marker!r}")
              return lines[: close + 1] + new_lines(lines[index]) + lines[close + 1 :]

          for path in paths:
              lines = path.read_text().splitlines()
              if not any("DurableSubmitError::Poisoned" in line for line in lines):
                  lines = insert_after_block(
                      lines,
                      "Err(DurableSubmitError::Closed(_))",
                      lambda marker: [
                          f"{marker[: len(marker) - len(marker.lstrip())]}Err(DurableSubmitError::Poisoned {{ reason, .. }}) => {{",
                          f"{marker[: len(marker) - len(marker.lstrip())]}    panic!(\"durable controller poisoned: {{reason}}\")",
                          f"{marker[: len(marker) - len(marker.lstrip())]}}}",
                      ],
                  )
              if not any("DurableTicketOutcome::Stopped" in line for line in lines):
                  lines = insert_after_block(
                      lines,
                      "DurableTicketOutcome::DurabilityFailed(error)",
                      lambda marker: [
                          f"{marker[: len(marker) - len(marker.lstrip())]}DurableTicketOutcome::Stopped(reason) => {{",
                          f"{marker[: len(marker) - len(marker.lstrip())]}    panic!(\"durable controller stopped during benchmark: {{reason:?}}\")",
                          f"{marker[: len(marker) - len(marker.lstrip())]}}}",
                      ],
                  )
              path.write_text("\n".join(lines) + "\n")
          PY
          rm .github/workflows/patch-m6d-bench-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle lifecycle outcomes in durability benchmarks"
          git push origin "HEAD:${{ github.head_ref }}"
